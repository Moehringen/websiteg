<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章后台</title><link rel="stylesheet" href="style.css"><body><main><section id="login"><p>文章后台</p><h1>登录</h1><form id="login-form"><input name="password" type="password" placeholder="密码" required><button>登录</button></form><small id="login-error"></small></section><section id="dashboard" hidden><header><div><p>文章后台</p><h1>文章管理</h1></div><button id="logout">退出</button></header><form id="article-form"><input name="id" type="hidden"><label>标题<input name="title" required></label><label>发布时间<input name="date" type="date" required></label><label>文章分类标签<input name="tags" placeholder="用逗号分隔"></label><label>正文<textarea name="content" rows="12"></textarea></label><div class="actions"><button>保存文章</button><button id="reset" type="button">清空</button></div></form><div id="articles"></div></section></main><script src="app.js"></script></body></html>
